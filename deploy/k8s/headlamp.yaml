# =============================================================================
# Headlamp —— K8s Web 管理面板（token 登录）
# 访问: http://111.230.142.110/headlamp  （Traefik 80 端口转发，无需新开防火墙）
#
# 学习要点：
#   ServiceAccount / ClusterRoleBinding —— K8s 的 RBAC 权限体系
#   长期 token —— v1.24+ 不再自动生成 SA token，需手动建 Secret
#   Ingress 子路径 —— 一个 80 端口按路径分流多个应用
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-ui

---
# 面板用的服务账号
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: k8s-ui

---
# 给账号绑定 cluster-admin 角色（学习环境给全权限；生产应最小化授权）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp-admin
  namespace: k8s-ui

---
# 长期登录 token（Secret 带 kubernetes.io/service-account.name 注解即自动填充 token）
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-admin-token
  namespace: k8s-ui
  annotations:
    kubernetes.io/service-account.name: headlamp-admin
type: kubernetes.io/service-account-token

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: k8s-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: headlamp }
  template:
    metadata:
      labels: { app: headlamp }
    spec:
      serviceAccountName: headlamp-admin
      containers:
      - name: headlamp
        image: headlamp/headlamp:latest
        imagePullPolicy: IfNotPresent
        args: ["--in-cluster"]
        ports:
        - containerPort: 4466   # 新版 Headlamp 默认端口是 4466（旧版才是 3000）
        resources:
          requests: { memory: 32Mi }
          limits:   { memory: 128Mi }

---
# 独立端口直通（绕过Traefik/Ingress，避免与商城 /api 路径冲突；
# nip.io域名方案被腾讯云未备案拦截废弃）
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: k8s-ui
spec:
  type: LoadBalancer        # k3s servicelb 直接把宿主机 8081 绑给该服务
  selector: { app: headlamp }
  ports:
  - port: 8081
    targetPort: 4466

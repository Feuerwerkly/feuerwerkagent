<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeuerwerkAgent - AI聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
            resize: vertical;
            min-height: 80px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .response-area {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
        }

        .response-content {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border-left-color: #f44;
        }

        .success {
            background: #efe;
            border-left-color: #4f4;
        }

        .streaming-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 FeuerwerkAgent</h1>
            <p>AI智能对话 - 逐字显示</p>
            <button onclick="testAPI()" style="max-width: 200px; margin: 10px auto; display: block;">测试API连接</button>
        </div>

        <div class="card">
            <h2>💬 AI聊天</h2>
            <div class="form-group">
                <label for="chatMessage">消息内容：</label>
                <textarea id="chatMessage" placeholder="输入你想说的话...">你好，请介绍一下自己</textarea>
            </div>
            <div class="button-group">
                <button onclick="sendChatMessage()" id="chatSendBtn">发送消息</button>
                <button onclick="clearChat()">清空</button>
            </div>
            <div class="loading" id="chatLoading">
                <div class="spinner"></div>
                <p>AI正在思考中...</p>
            </div>
            <div class="response-area" id="chatResponse" style="display: none;"></div>
        </div>

        <div class="card">
            <h2>🔍 联网搜索</h2>
            <div class="form-group">
                <label for="searchQuery">搜索关键词：</label>
                <textarea id="searchQuery" placeholder="输入搜索内容..." style="min-height: 60px;">人工智能最新发展</textarea>
            </div>
            <div class="button-group">
                <button onclick="performSearch()" id="searchSendBtn">开始搜索</button>
                <button onclick="clearSearch()">清空</button>
            </div>
            <div class="loading" id="searchLoading">
                <div class="spinner"></div>
                <p>正在搜索网络信息...</p>
            </div>
            <div class="response-area" id="searchResponse" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api/ai';

        // 发送聊天消息
        async function sendChatMessage() {
            const message = document.getElementById('chatMessage').value.trim();
            if (!message) {
                alert('请输入消息内容');
                return;
            }

            const loading = document.getElementById('chatLoading');
            const responseArea = document.getElementById('chatResponse');
            const sendBtn = document.getElementById('chatSendBtn');

            loading.classList.add('active');
            responseArea.style.display = 'none';
            sendBtn.disabled = true;

            try {
                console.log('🚀 开始发送DeepSeek流式消息:', message);

                // 显示响应区域
                responseArea.className = 'response-area success';
                responseArea.innerHTML = `
                    <h3>💬 DeepSeek回复 <span class="streaming-indicator"></span></h3>
                    <div class="response-content" id="chatContent"></div>
                `;
                responseArea.style.display = 'block';

                // 使用EventSource进行真正的流式请求
                const eventSource = new EventSource(`${API_BASE}/stream/chat?message=${encodeURIComponent(message)}`);

                eventSource.addEventListener('start', (e) => {
                    console.log('✅ 流式连接已建立');
                });

                eventSource.addEventListener('chunk', (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        console.log('📝 收到文本块:', data.content);

                        const contentDiv = document.getElementById('chatContent');
                        if (contentDiv && data.content) {
                            contentDiv.textContent += data.content;
                            // 自动滚动到底部
                            responseArea.scrollTop = responseArea.scrollHeight;
                        }
                    } catch (error) {
                        console.error('解析chunk失败:', error);
                    }
                });

                eventSource.addEventListener('complete', (e) => {
                    console.log('✅ 流式响应完成');
                    const indicator = document.querySelector('.streaming-indicator');
                    if (indicator) indicator.style.display = 'none';
                    eventSource.close();
                    loading.classList.remove('active');
                    sendBtn.disabled = false;
                });

                eventSource.addEventListener('error', (e) => {
                    console.error('❌ 流式连接错误:', e);
                    const indicator = document.querySelector('.streaming-indicator');
                    if (indicator) indicator.style.display = 'none';

                    const contentDiv = document.getElementById('chatContent');
                    if (contentDiv) {
                        contentDiv.textContent += '\n\n❌ 连接中断，请重试';
                    }

                    eventSource.close();
                    loading.classList.remove('active');
                    sendBtn.disabled = false;
                });

                // 超时处理
                setTimeout(() => {
                    if (eventSource.readyState !== EventSource.CLOSED) {
                        console.warn('⚠️ 流式连接超时');
                        eventSource.close();
                        const indicator = document.querySelector('.streaming-indicator');
                        if (indicator) indicator.style.display = 'none';
                        loading.classList.remove('active');
                        sendBtn.disabled = false;
                    }
                }, 120000);

            } catch (error) {
                console.error('❌ 请求失败:', error);
                responseArea.className = 'response-area error';
                responseArea.innerHTML = `
                    <h3>❌ 错误</h3>
                    <div class="response-content">${error.message}</div>
                `;
                responseArea.style.display = 'block';
                loading.classList.remove('active');
                sendBtn.disabled = false;
            }
        }

        // 执行搜索
        async function performSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                alert('请输入搜索关键词');
                return;
            }

            const loading = document.getElementById('searchLoading');
            const responseArea = document.getElementById('searchResponse');
            const sendBtn = document.getElementById('searchSendBtn');

            loading.classList.add('active');
            responseArea.style.display = 'none';
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/search/simple`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();

                responseArea.className = 'response-area ' + (data.success ? 'success' : 'error');

                if (data.success) {
                    let html = `<h3>🔍 搜索结果</h3>`;

                    if (data.aiSummary) {
                        html += `<div style="margin-bottom: 15px;"><strong>AI摘要：</strong><br>${data.aiSummary}</div>`;
                    }

                    if (data.results && data.results.length > 0) {
                        html += '<div><strong>搜索结果：</strong><ul style="margin-top: 10px;">';
                        data.results.forEach((result, index) => {
                            html += `
                                <li style="margin-bottom: 15px;">
                                    <a href="${result.url}" target="_blank" style="color: #667eea; font-weight: 600;">
                                        ${result.title}
                                    </a>
                                    <br><small style="color: #666;">${result.snippet}</small>
                                    <br><small style="color: #999;">来源: ${result.source}</small>
                                </li>
                            `;
                        });
                        html += '</ul></div>';
                    } else {
                        html += '<div>没有找到相关结果</div>';
                    }

                    responseArea.innerHTML = html;
                } else {
                    responseArea.innerHTML = `
                        <h3>❌ 搜索失败</h3>
                        <div class="response-content">${data.error}</div>
                    `;
                }

                responseArea.style.display = 'block';
            } catch (error) {
                responseArea.className = 'response-area error';
                responseArea.innerHTML = `
                    <h3>❌ 网络错误</h3>
                    <div class="response-content">${error.message}</div>
                `;
                responseArea.style.display = 'block';
            } finally {
                loading.classList.remove('active');
                sendBtn.disabled = false;
            }
        }

        function clearChat() {
            document.getElementById('chatMessage').value = '';
            document.getElementById('chatResponse').style.display = 'none';
        }

        function clearSearch() {
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResponse').style.display = 'none';
        }

        async function testAPI() {
            try {
                const response = await fetch(`${API_BASE}/test`);
                const result = await response.text();
                alert('API测试结果:\n' + result);
            } catch (error) {
                alert('API测试失败: ' + error.message);
            }
        }

        // 页面加载时检查服务器状态
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    console.log('✅ 服务器运行正常');
                } else {
                    console.warn('⚠️ 服务器响应异常');
                }
            } catch (error) {
                console.error('❌ 无法连接到服务器，请确保服务已启动');
                alert('无法连接到服务器，请确保应用已启动: mvn spring-boot:run');
            }
        });
    </script>
</body>
</html>
